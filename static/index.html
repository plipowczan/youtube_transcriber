<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Transcriber - Extract Video Transcripts</title>
    <meta name="description" content="Extract transcripts from YouTube videos instantly with our modern, easy-to-use transcription tool.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="background-gradient"></div>
    
    <div class="container">
        <header class="header">
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="40" height="40" rx="12" fill="url(#gradient)"/>
                    <path d="M16 13L26 20L16 27V13Z" fill="white"/>
                    <defs>
                        <linearGradient id="gradient" x1="0" y1="0" x2="40" y2="40">
                            <stop offset="0%" stop-color="#667eea"/>
                            <stop offset="100%" stop-color="#764ba2"/>
                        </linearGradient>
                    </defs>
                </svg>
                <h1>YouTube Transcriber</h1>
            </div>
            <p class="tagline">Extract transcripts from any YouTube video instantly</p>
        </header>

        <main class="main-content">
            <div class="input-section">
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="youtube-url" 
                        placeholder="Paste YouTube URL here..."
                        autocomplete="off"
                    >
                    <button id="transcribe-btn" class="transcribe-btn">
                        <span class="btn-text">Transcribe</span>
                        <span class="btn-loader"></span>
                    </button>
                </div>
                <p class="input-hint">Supports youtube.com/watch?v=... and youtu.be/... formats</p>
            </div>

            <div id="error-message" class="error-message hidden"></div>

            <div id="result-section" class="result-section hidden">
                <div class="result-header">
                    <h2>Transcript</h2>
                    <div class="result-actions">
                        <button id="copy-btn" class="action-btn">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                            Copy
                        </button>
                        <button id="download-btn" class="action-btn">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="7 10 12 15 17 10"></polyline>
                                <line x1="12" y1="15" x2="12" y2="3"></line>
                            </svg>
                            Download
                        </button>
                    </div>
                </div>
                <div class="transcript-container">
                    <p id="transcript-text"></p>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>Made with ❤️ using FastAPI and YouTube Transcript API</p>
        </footer>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
